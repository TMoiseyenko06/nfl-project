[project]
name = "nflpred"
version = "0.1.0"
description = "NFL game prediction: nflverse ingest, leak-free features, walk-forward backtesting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "scipy>=1.10",
    "tzdata>=2024.1",  # IANA zones; zoneinfo has no bundled DB on slim images
]

[project.optional-dependencies]
# torch is imported lazily; the Phase 3 neural model is the only thing needing it.
neural = ["torch>=2.0"]

[project.scripts]
nflpred = "nflpred.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["nflpred*"]
