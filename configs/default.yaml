# NFL prediction system configuration.
# Nothing in the codebase hardcodes a season, path, or hyperparameter; it all lives here.

paths:
  raw_cache: data/cache/raw
  feature_cache: data/cache/features
  artifacts: artifacts
  prediction_log: artifacts/prediction_log.csv
  performance_log: artifacts/performance_log.csv

data:
  # Training window. 2015+ keeps the rule environment roughly comparable
  # (post-2015 XP distance, modern passing era) while giving ~3k games.
  start_season: 2015
  end_season: 2026
  # Play-by-play is pulled from start_season - pbp_warmup_seasons so that rolling
  # features are already "warm" on the first game we actually train on.
  pbp_warmup_seasons: 1
  season_types: ["REG", "POST"]
  # Games with these types are scored but never used as training rows when false.
  include_postseason_in_training: true

sources:
  games_url: "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
  pbp_url_template: "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{season}.parquet"

features:
  # Rolling windows (in games, per team) for EPA/success-rate aggregates.
  rolling_windows: [4, 8, 17]
  # Exponentially-weighted half-life in games, used alongside the flat windows.
  ewma_halflife: 6.0
  # Opponent adjustment: ridge penalty and recency decay (half-life in days).
  opponent_adjust:
    enabled: true
    ridge_alpha: 12.0
    recency_halflife_days: 400.0
    min_games_required: 64
    # Refit cadence: one fit per (season, week) as-of boundary.
  weather:
    # Observed temp/wind exist for completed outdoor games only and are NOT
    # available pre-kickoff. See README "Weather honesty note".
    # modes: "observed" (backtest-optimistic), "climatology" (leak-free), "none"
    mode: climatology
  elo:
    k: 20.0
    home_field: 55.0
    season_regression: 0.33
    mov_multiplier: true
    initial_rating: 1500.0

backtest:
  # Walk-forward: train on everything strictly before the test week, predict it, roll on.
  first_test_season: 2017
  first_test_week: 1
  # Minimum training rows before a fold is scored.
  min_train_games: 500
  # Refit the model every N weeks (1 = every week). Retraining every week is
  # cheap at this sample size, so 1 is the default.
  refit_every_weeks: 1

models:
  seed: 1729
  logistic:
    C: 0.08
    max_iter: 2000
  ridge:
    alpha: 30.0
  lightgbm:
    # Deliberately small. ~3k rows means anything deeper memorises.
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 7
    max_depth: 3
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_alpha: 1.0
    reg_lambda: 10.0
    verbosity: -1

evaluation:
  # Standard -110 juice: you need 11/21 = 52.38% to break even against the spread.
  ats_breakeven: 0.5238
  calibration_bins: 10
