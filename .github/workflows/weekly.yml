name: Weekly update

# Predict the upcoming week and score the last one.
# Runs Tuesday 13:00 UTC (after Monday Night Football has settled) so that
# predictions are always written well before the next slate kicks off.
on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Fetch latest nflverse data
        run: nflpred fetch

      - name: Rebuild features
        run: nflpred build-features --force

      # Gate the weekly run on the leakage audit. If the audit fails, no
      # prediction from this data vintage should be trusted or logged.
      - name: Leakage audit
        run: pytest tests/test_leakage.py -q

      - name: Score last week's logged predictions
        run: nflpred score

      - name: Predict the upcoming week
        run: nflpred predict-week

      - name: Commit prediction and performance logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/prediction_log.csv artifacts/performance_log.csv
          if git diff --staged --quiet; then
            echo "no new predictions to commit"
          else
            git commit -m "weekly: predictions and scores $(date -u +%Y-%m-%d)"
            git push
          fi
