name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Tuesday 12:00 UTC - after Monday Night Football has settled.
    - cron: "0 12 * * 2"

jobs:
  test:
    name: tests + leakage audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Cache nflverse data
        uses: actions/cache@v4
        with:
          path: data/cache/raw
          # Bump the suffix to force a refresh of the pinned data vintage.
          key: nflverse-raw-v1

      - name: Fetch data
        run: nflpred fetch

      - name: Build features
        run: nflpred build-features

      # The leakage audit is the gate. If features for a past game change when
      # future games are added - or when that game's own result changes - the
      # build fails and no model result from this commit is trustworthy.
      - name: Leakage audit
        run: pytest tests/test_leakage.py -v

      - name: Feature unit tests
        run: pytest tests/test_features.py -v

      - name: Backtest smoke test
        run: pytest tests/test_backtest.py -v

      - name: Audit summary
        run: nflpred audit
